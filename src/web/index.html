<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccc</title>
    <link rel="stylesheet" href="/dsh-tokens.css" />
    <link rel="stylesheet" href="/dsh-shell.css" />
  </head>
  <body>
    <div class="frame">
      <aside class="sidebarCol">
        <div class="sidebar">
          <div class="logoRow">
            <span class="brandMark" aria-hidden="true"></span>
            <span class="brandName">ccc</span>
          </div>
          <button id="new-chat" class="newChat" type="button">新对话</button>
          <div class="sessionList">
            <button class="sessionItem" type="button" aria-current="true">当前会话</button>
          </div>
          <label class="modeField">
            <span>权限</span>
            <select id="mode">
              <option value="default">default</option>
              <option value="acceptEdits">acceptEdits</option>
              <option value="plan">plan</option>
              <option value="auto">auto</option>
              <option value="dontAsk">dontAsk</option>
              <option value="bypassPermissions">bypassPermissions</option>
            </select>
          </label>
          <div class="workspace">
            <div id="cwd"></div>
            <div id="model"></div>
          </div>
        </div>
      </aside>
      <section class="centerCol">
        <div class="mainPanel">
          <header class="topbar">
            <div>对话</div>
            <div id="status">就绪</div>
          </header>
          <section id="transcript" class="transcript"></section>
          <form id="composer" class="composer">
            <textarea
              id="input"
              class="composerInput"
              rows="1"
              placeholder="描述要做的修改，回车发送，Shift+回车换行"
            ></textarea>
            <button id="send" class="send" type="submit">发送</button>
          </form>
        </div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
